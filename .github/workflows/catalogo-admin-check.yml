name: Validar administracion del catalogo
on:
  push:
    branches: [main, catalogo-admin-categorias]
    paths:
      - index.html
      - admin.html
      - assets/**
      - data/productos*.json
      - tools/**
      - .github/workflows/catalogo-admin-check.yml
  pull_request:
    branches: [main]
    paths:
      - index.html
      - admin.html
      - assets/**
      - data/productos*.json
      - tools/**
      - .github/workflows/catalogo-admin-check.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalogo-admin-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generar rutas de todas las categorias
        run: node tools/build-seo-pages.mjs
      - name: Validar SEO y logica del catalogo
        run: |
          node tools/validate-seo.mjs
          node --test tools/test-catalog-admin.cjs
      - name: Preparar navegador de pruebas
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Probar administrador y escaparate en movil y escritorio
        env:
          REVIEW_SCREENSHOT_DIR: /tmp/maderarte-review
        run: node tools/test-catalog-browser.cjs
      - name: Probar contratos existentes, precios, imagenes y fichas
        env:
          REVIEW_SCREENSHOT_DIR: /tmp/maderarte-review
        run: node tools/guardrails.js
      - name: Capturas de revision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogo-review
          retention-days: 3
          path: /tmp/maderarte-review/
