name: Revisar acceso ADMIN
on:
  push:
    branches: [admin-acceso-marca]
    paths:
      - assets/admin-access.js
      - tools/refine-admin-entry.mjs
      - tools/test-admin-access.cjs
      - .github/workflows/admin-entry-review.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: admin-entry-refinement
  cancel-in-progress: true
jobs:
  review:
    if: github.ref == 'refs/heads/admin-acceso-marca'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar cambios limitados al administrador
        run: |
          if [ -f tools/refine-admin-entry.mjs ]; then node tools/refine-admin-entry.mjs; fi
          node --check assets/admin-access.js
          node --check assets/admin-catalog.js
          node --check tools/test-catalog-browser.cjs
      - name: Probar cifrado, permisos y catalogo
        run: |
          node --test tools/test-catalog-admin.cjs
          node tools/validate-seo.mjs
      - name: Preparar navegador
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Probar acceso y edicion en movil y escritorio
        env:
          REVIEW_SCREENSHOT_DIR: /tmp/admin-entry-review
        run: node tools/test-catalog-browser.cjs
      - name: Comprobar que el escaparate sigue funcionando
        env:
          REVIEW_SCREENSHOT_DIR: /tmp/admin-entry-review
        run: node tools/guardrails.js
      - name: Preparar archivos para revision
        if: always()
        run: |
          mkdir -p /tmp/admin-entry-review/source/assets /tmp/admin-entry-review/source/tools
          cp admin.html CATALOGO-ADMIN.md /tmp/admin-entry-review/source/
          cp assets/admin-access.js assets/admin-catalog.css assets/admin-catalog.js /tmp/admin-entry-review/source/assets/
          cp tools/test-admin-access.cjs tools/test-catalog-browser.cjs tools/test-catalog-admin.cjs /tmp/admin-entry-review/source/tools/
      - name: Capturas y fuente revisada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-entry-review
          retention-days: 3
          path: /tmp/admin-entry-review/
      - name: Guardar unicamente cambios validados en la rama de trabajo
        run: |
          git diff --exit-code -- data index.html
          git config user.name "Maderarte ADMIN QA"
          git config user.email "actions@users.noreply.github.com"
          rm -f tools/refine-admin-entry.mjs
          git add -A -- admin.html assets/admin-catalog.css assets/admin-catalog.js tools/test-catalog-browser.cjs tools/test-catalog-admin.cjs tools/refine-admin-entry.mjs CATALOGO-ADMIN.md
          if ! git diff --cached --quiet; then
            git commit -m "Refinar entrada ADMIN con marca original y contraseña por navegador"
            git push origin HEAD:admin-acceso-marca
          fi
